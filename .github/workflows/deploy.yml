name: Deploy Angular WASM SPA to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build AssemblyScript WASM
        run: npm run build:wasm

      - name: Run unit tests
        run: npm test -- --watch=false

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build Angular application
        run: npx ng build --configuration production --base-href "/${{ github.event.repository.name }}/"

      - name: Configure SPA fallback for direct routes
        run: cp dist/mcsitrade/browser/index.html dist/mcsitrade/browser/404.html

      - name: Upload build artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/mcsitrade/browser

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
